version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: ${STACK_NAME:-grxm}-nginx
    networks:
      - grxm-net
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp
      - grxm-iam
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: ${STACK_NAME:-grxm}-mongo
    networks:
      - grxm-net
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  mongo-app:
    image: mongo:6.0
    container_name: ${STACK_NAME:-grxm}-mongo-app
    networks:
      - grxm-net
    volumes:
      - mongo-app-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME:-grxm}-redis
    networks:
      - grxm-net
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  grxm-iam:
    build:
      context: ./grxm-iam
      dockerfile: ../build/Dockerfile.iam
    container_name: ${STACK_NAME:-grxm}-iam
    networks:
      - grxm-net
    volumes:
      - ./config/iam-config.json:/app/config.json
      - ./iam-keys:/app/keys
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      - IAM_CONFIG_LOCATION=/app/config.json
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  webapp:
    build:
      context: ./grxm-webapp
      dockerfile: ../build/Dockerfile.webapp
    container_name: ${STACK_NAME:-grxm}-webapp
    networks:
      - grxm-net
    volumes:
      - ./config/webapp-config.json:/app/config.json
      - ./grxm-webapp/dynamic:/app/dynamic
      - ./grxm-webapp/static:/app/static
      - ./grxm-webapp/assets:/app/assets
    depends_on:
      grxm-iam:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo-app:
        condition: service_started
    environment:
      - API_CONFIG_LOCATION=/app/config.json
    restart: unless-stopped

networks:
  grxm-net:
    name: ${STACK_NAME:-grxm}-net
    driver: bridge

volumes:
  mongo-data:
    name: ${STACK_NAME:-grxm}-mongo-data
  redis-data:
    name: ${STACK_NAME:-grxm}-redis-data
  mongo-app-data:
    name: ${STACK_NAME:-grxm}-mongo-app-data
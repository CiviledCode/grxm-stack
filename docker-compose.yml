version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: grxm-nginx
    networks:
      - grxm-net
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp
      - grxm-iam
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: grxm-mongo
    networks:
      - grxm-net
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  grxm-iam:
    build:
      context: ${PROJECT_ROOT}/grxm-iam
      dockerfile: /home/civ/Projects/grxm-stack/build/Dockerfile.iam
    container_name: grxm-iam
    networks:
      - grxm-net
    volumes:
      - ./config/iam-config.json:/app/config.json
      - ./iam-keys:/app/keys
    depends_on:
      - mongo
    environment:
      - IAM_CONFIG_LOCATION=/app/config.json
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  webapp:
    build:
      context: ${PROJECT_ROOT}/grxm-webapp
      dockerfile: /home/civ/Projects/grxm-stack/build/Dockerfile.webapp
    container_name: grxm-webapp
    networks:
      - grxm-net
    volumes:
      - ./config/webapp-config.json:/app/config.json
      - ${PROJECT_ROOT}/grxm-webapp/dynamic:/app/dynamic
      - ${PROJECT_ROOT}/grxm-webapp/static:/app/static
    depends_on:
      grxm-iam:
        condition: service_healthy
    environment:
      - API_CONFIG_LOCATION=/app/config.json
    restart: unless-stopped

networks:
  grxm-net:
    driver: bridge

volumes:
  mongo-data:
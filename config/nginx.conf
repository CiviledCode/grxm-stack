events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Use Docker's built-in DNS resolver
        resolver 127.0.0.11 valid=10s;

        # Route requests starting with /iam/ to the grxm-iam service
        location /iam/ {
            # Block external access to the authority websocket
            location = /iam/api/v1/authority {
                deny all;
                return 403;
            }

            set $iam_upstream http://grxm-iam:8081;
            proxy_pass $iam_upstream$request_uri;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route all other requests to the webapp service
        location / {
            set $webapp_upstream http://webapp:8080;
            proxy_pass $webapp_upstream$request_uri;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for the webapp if needed
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
